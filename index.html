<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Reuniões Holy Cook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Tokens: claro ────────────────────────────────────────────────────── */
  :root {
    --bg:          #F6F4F7;
    --surface:     #FFFFFF;
    --surface-2:   #EFEAF2;
    --ink:         #1E1A20;
    --ink-2:       #615A66;
    --ink-3:       #8B8391;
    --line:        #E3DEE8;
    --line-2:      #CEC6D6;
    --accent:      #8A2F62;
    --accent-ink:  #6E2450;
    --accent-soft: #F4E5EE;
    --ok:          #2E6B4F;
    --ok-soft:     #E1F0E8;
    --warn:        #8A6212;
    --warn-soft:   #F7ECD7;
    --late:        #A32A22;
    --late-soft:   #F8E4E2;
    --shadow-1:    0 1px 2px rgba(30,26,32,.05), 0 10px 28px -18px rgba(30,26,32,.35);
    --shadow-2:    0 2px 6px rgba(30,26,32,.07), 0 24px 60px -26px rgba(30,26,32,.45);

    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

    --radius: 10px;
    --maxw: 940px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:          #141118;
      --surface:     #1D1922;
      --surface-2:   #262030;
      --ink:         #EFEAF3;
      --ink-2:       #A79EB0;
      --ink-3:       #7C7386;
      --line:        #2F2839;
      --line-2:      #443B50;
      --accent:      #E28BBE;
      --accent-ink:  #F0B4D5;
      --accent-soft: #3A1E30;
      --ok:          #74C79B;
      --ok-soft:     #1B3129;
      --warn:        #DCA94A;
      --warn-soft:   #33280F;
      --late:        #E88377;
      --late-soft:   #3A1F1C;
      --shadow-1:    0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
      --shadow-2:    0 2px 6px rgba(0,0,0,.45), 0 24px 60px -26px rgba(0,0,0,.9);
    }
  }

  :root[data-theme="dark"] {
    --bg:          #141118;
    --surface:     #1D1922;
    --surface-2:   #262030;
    --ink:         #EFEAF3;
    --ink-2:       #A79EB0;
    --ink-3:       #7C7386;
    --line:        #2F2839;
    --line-2:      #443B50;
    --accent:      #E28BBE;
    --accent-ink:  #F0B4D5;
    --accent-soft: #3A1E30;
    --ok:          #74C79B;
    --ok-soft:     #1B3129;
    --warn:        #DCA94A;
    --warn-soft:   #33280F;
    --late:        #E88377;
    --late-soft:   #3A1F1C;
    --shadow-1:    0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
    --shadow-2:    0 2px 6px rgba(0,0,0,.45), 0 24px 60px -26px rgba(0,0,0,.9);
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px 80px; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  /* ── Masthead ────────────────────────────────────────────────────────── */
  .masthead {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 30px 0 18px; border-bottom: 1px solid var(--line);
  }

  .monogram {
    width: 40px; height: 40px; flex: none;
    display: grid; place-items: center;
    border-radius: 9px; background: var(--accent); color: var(--surface);
    font-family: var(--font-display); font-size: 17px; letter-spacing: .02em;
  }
  :root[data-theme="dark"] .monogram { color: var(--bg); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .monogram { color: var(--bg); } }

  .masthead-text { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
  .eyebrow {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .13em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .masthead h1 {
    font-family: var(--font-display); font-size: 25px; font-weight: 600;
    letter-spacing: -.01em; text-wrap: balance;
  }

  /* identidade + status de conexão */
  .ident { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .ident-field {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line-2); border-radius: 100px;
    padding: 5px 12px; background: var(--surface);
  }
  .ident-field label {
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .ident-field input {
    font: inherit; font-size: 13px; border: none; background: transparent;
    color: var(--ink); width: 96px; padding: 0;
  }
  .ident-field input:focus { outline: none; }
  .ident-field.vazio { border-style: dashed; border-color: var(--accent); }

  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .conn.on   .conn-dot { background: var(--ok); }
  .conn.off  .conn-dot { background: var(--late); }
  .conn.slow .conn-dot { background: var(--warn); }

  /* ── Seções ──────────────────────────────────────────────────────────── */
  .section { margin-top: 40px; }
  .section-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 16px; padding-bottom: 9px; border-bottom: 1px solid var(--line);
  }
  .section-head h2 { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
  .section-head .hint { font-size: 12.5px; color: var(--ink-3); margin-left: auto; text-align: right; }

  /* ── Cards ───────────────────────────────────────────────────────────── */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(276px, 1fr)); gap: 16px; }

  .card {
    display: flex; flex-direction: column; gap: 12px;
    text-align: left; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px 18px 15px;
    cursor: pointer; box-shadow: var(--shadow-1);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--line-2); }
  .card:active { transform: translateY(0); }

  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .card-title {
    font-family: var(--font-display); font-size: 18.5px; font-weight: 600;
    line-height: 1.25; text-wrap: balance; flex: 1;
  }
  .card-summary { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }

  .card-next { padding-top: 12px; border-top: 1px dashed var(--line-2); display: flex; flex-direction: column; gap: 2px; }
  .next-label {
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .next-when {
    font-family: var(--font-mono); font-size: 13px; color: var(--accent);
    font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  }
  .next-what { font-size: 13.5px; line-height: 1.4; color: var(--ink); }
  .card-next.done .next-what { color: var(--ok); }

  .card-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .open-count { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .card-cta { margin-left: auto; font-size: 12.5px; color: var(--accent); font-weight: 600; }

  /* ── Chips ───────────────────────────────────────────────────────────── */
  .chip {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 100px;
    white-space: nowrap; flex: none; display: inline-block;
  }
  .chip.ok    { background: var(--ok-soft);     color: var(--ok); }
  .chip.warn  { background: var(--warn-soft);   color: var(--warn); }
  .chip.late  { background: var(--late-soft);   color: var(--late); }
  .chip.idle  { background: var(--surface-2);   color: var(--ink-2); }
  .chip.brand { background: var(--accent-soft); color: var(--accent-ink); }

  /* ── Campo de data ───────────────────────────────────────────────────── */
  .dateedit {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line-2); border-radius: 100px;
    padding: 4px 11px; cursor: pointer; background: var(--surface);
    transition: border-color .15s ease, background .15s ease;
  }
  .dateedit:hover { border-color: var(--accent); }
  .dateedit.empty { border-style: dashed; background: transparent; }
  .dateedit.empty::before { content: "＋"; color: var(--accent); font-size: 13px; line-height: 1; }
  .dateedit input[type="date"] {
    font-family: var(--font-mono); font-size: 12.5px;
    border: none; background: transparent; color: var(--ink);
    padding: 0; margin: 0; min-width: 104px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .dateedit input[type="date"]:focus { outline: none; }
  .prazo-hint { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .prazo-cell { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ── Reuniões ────────────────────────────────────────────────────────── */
  .meetings { display: flex; flex-direction: column; gap: 10px; }
  .meeting {
    display: flex; align-items: center; gap: 16px; width: 100%;
    text-align: left; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 18px; cursor: pointer;
    transition: border-color .16s ease, background .16s ease;
  }
  .meeting:hover { border-color: var(--accent); background: var(--surface-2); }
  .meeting-date {
    font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums;
    color: var(--accent); flex: none; width: 100px;
  }
  .meeting-body { flex: 1; min-width: 0; }
  .meeting-title { font-weight: 600; font-size: 14.5px; }
  .meeting-meta { font-size: 12.5px; color: var(--ink-2); }
  .meeting-cta { color: var(--accent); font-size: 12.5px; font-weight: 600; flex: none; }

  /* ── Diálogo ─────────────────────────────────────────────────────────── */
  dialog {
    border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); color: var(--ink); padding: 0;
    width: min(720px, calc(100vw - 32px));
    max-height: min(88vh, 900px);
    box-shadow: var(--shadow-2);
  }
  dialog::backdrop { background: rgba(20,17,24,.55); backdrop-filter: blur(3px); }

  .sheet { display: flex; flex-direction: column; max-height: inherit; }
  .sheet-head {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 22px 24px 16px; border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .sheet-head h2 {
    font-family: var(--font-display); font-size: 22px; font-weight: 600;
    line-height: 1.2; text-wrap: balance;
  }
  .sheet-origin {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px;
  }
  .close {
    flex: none; width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
    font-size: 18px; line-height: 1; cursor: pointer;
  }
  .close:hover { background: var(--surface-2); color: var(--ink); }

  .sheet-body { padding: 20px 24px 30px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet-body h3 {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3); margin: 26px 0 10px;
  }
  .sheet-body h3:first-child { margin-top: 0; }

  .resumo { font-size: 14.5px; line-height: 1.6; color: var(--ink); }
  .resumo + .resumo { margin-top: 10px; }

  /* ── Ações ───────────────────────────────────────────────────────────── */
  .acoes { display: flex; flex-direction: column; gap: 9px; }

  .acao {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 12px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 13px 15px;
    transition: border-color .15s ease, opacity .15s ease;
  }
  .acao.feita { opacity: .62; }
  .acao.feita .acao-txt { text-decoration: line-through; color: var(--ink-2); }
  .acao.bloqueia:not(.feita) { border-color: var(--late); }
  .acao.salvando { border-color: var(--accent); }

  .acao-check {
    grid-row: 1 / span 2; align-self: start;
    width: 22px; height: 22px; margin-top: 1px;
    accent-color: var(--accent); cursor: pointer; flex: none;
  }
  .acao-txt { font-size: 15px; font-weight: 600; line-height: 1.4; }
  .acao-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 4px; }
  .acao-quem {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3);
    letter-spacing: .02em; width: 100%;
  }

  .owner-note { font-size: 12.5px; color: var(--ink-2); margin: -2px 0 10px; }

  .openlist { display: flex; flex-direction: column; gap: 7px; }
  .openlist li { list-style: none; font-size: 13.5px; color: var(--ink-2); padding-left: 18px; position: relative; }
  .openlist li::before {
    content: ""; position: absolute; left: 3px; top: 8px;
    width: 5px; height: 5px; border-radius: 50%; border: 1px solid var(--accent);
  }

  /* ── Ata completa ────────────────────────────────────────────────────── */
  .ata-doc { display: flex; flex-direction: column; gap: 26px; }
  .ata-sec { scroll-margin-top: 8px; }
  .ata-sec > h4 {
    font-family: var(--font-display); font-size: 17.5px; font-weight: 600;
    margin-bottom: 9px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; text-wrap: balance;
  }
  .ata-sec.alvo > h4 { color: var(--accent); border-bottom-color: var(--accent); }
  .ata-sec p { font-size: 14.5px; line-height: 1.62; color: var(--ink); }
  .ata-sec p + p { margin-top: 10px; }
  .ata-sec .acoes { margin-top: 4px; }

  .linkata {
    margin-top: 28px; width: 100%; font: inherit; font-size: 13.5px; font-weight: 600;
    text-align: left; padding: 14px 16px; border-radius: var(--radius);
    border: 1px solid var(--line-2); background: var(--surface-2);
    color: var(--accent); cursor: pointer;
  }
  .linkata:hover { border-color: var(--accent); }

  .footnote {
    margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink-3);
  }

  /* ── Aviso de erro de sincronização ──────────────────────────────────── */
  .erro {
    position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 50;
    display: none; gap: 10px; align-items: center;
    padding: 12px 16px; border-radius: var(--radius);
    background: var(--late-soft); color: var(--late);
    border: 1px solid var(--late); font-size: 13px;
    max-width: 560px; margin: 0 auto;
  }
  .erro.on { display: flex; }

  /* ── Mobile ──────────────────────────────────────────────────────────── */
  @media (max-width: 640px) {
    body { font-size: 16px; }
    .wrap { padding: 0 16px 56px; }

    .masthead { padding: 20px 0 16px; }
    .masthead h1 { font-size: 22px; }
    .ident { width: 100%; justify-content: space-between; }

    .section { margin-top: 32px; }
    .section-head { flex-direction: column; align-items: flex-start; gap: 2px; }
    .section-head .hint { margin-left: 0; text-align: left; }

    .cards { grid-template-columns: 1fr; }
    .card { padding: 17px 16px 14px; }

    .meeting { flex-wrap: wrap; gap: 4px 12px; padding: 14px 16px; }
    .meeting-date { width: auto; }
    .meeting-cta { margin-left: auto; }

    dialog {
      width: 100vw; max-width: 100vw; max-height: 92vh; height: auto;
      margin: auto 0 0; border-radius: 16px 16px 0 0;
      border-left: none; border-right: none; border-bottom: none;
    }
    .sheet-head { position: sticky; top: 0; z-index: 2; padding: 18px 18px 14px; }
    .sheet-head h2 { font-size: 20px; }
    .sheet-body { padding: 18px 18px 40px; }
    .close { width: 36px; height: 36px; }

    .acao { padding: 14px 15px; }
    .acao-check { width: 24px; height: 24px; }
    .dateedit { padding: 6px 12px; }
    .dateedit input[type="date"] { font-size: 14px; min-width: 118px; }

    .erro { bottom: calc(16px + env(safe-area-inset-bottom)); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="masthead">
    <div class="monogram">HC</div>
    <div class="masthead-text">
      <span class="eyebrow">Holy Cook</span>
      <h1>Reuniões &amp; Projetos</h1>
    </div>
    <div class="ident">
      <span class="ident-field vazio" id="ident-field">
        <label for="ident">Você é</label>
        <input id="ident" type="text" placeholder="seu nome" autocomplete="off" maxlength="24">
      </span>
      <span class="conn" id="conn"><span class="conn-dot"></span><span id="conn-txt">conectando…</span></span>
    </div>
  </header>

  <section class="section">
    <div class="section-head">
      <h2>Projetos</h2>
      <span class="hint">Toque para ver o que foi falado e as ações</span>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Reuniões</h2>
      <span class="hint">A ata completa de cada uma</span>
    </div>
    <div class="meetings" id="meetings"></div>
  </section>

  <p class="footnote">O que você marcar aqui é salvo para todo mundo, na hora. Qualquer pessoa com este link pode editar.</p>

</div>

<div class="erro" id="erro"><span id="erro-txt"></span></div>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="sheet-head">
      <div style="flex:1; min-width:0">
        <div class="sheet-origin" id="sheet-origin"></div>
        <h2 id="sheet-title"></h2>
      </div>
      <button class="close" id="sheet-close" aria-label="Fechar">&times;</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ═══ CONFIG ══════════════════════════════════════════════════════════════

   A chave abaixo é a `anon` — pública por natureza. O projeto para o qual
   ela aponta NÃO contém nenhum dado pessoal: só a tabela `hc_acoes`.
   ════════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL  = "https://mkajvxyiyqxotiydkylq.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rYWp2eHlpeXF4b3RpeWRreWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NTgzNzcsImV4cCI6MjEwMjAzNDM3N30.vfHCb8BRcshufnp_7eAt9ch4aVEMpcbVA5u16IS0Kao";
const TABELA = "hc_acoes";

/* ═══ DADOS DA ATA ════════════════════════════════════════════════════════
   Nova reunião: acrescente um objeto em REUNIOES com a ata completa por
   assunto, e as ações novas dentro do projeto correspondente em PROJETOS.
   id da ação: chave estável — é o que liga a linha do banco à ação certa.
   ════════════════════════════════════════════════════════════════════════ */

const REUNIOES = [
  {
    id: "2026-08-11",
    data: "2026-08-11",
    titulo: "Reunião de Marketing — pauta sem o Bruno",
    participantes: "Fred, Yuri e Débora",
    ausentes: "Bruno",
    ata: [
      {
        id: "abertura",
        titulo: "Abertura",
        paragrafos: [
          "A reunião foi convocada para avançar os assuntos que não dependiam do Bruno, que não participou. A avaliação foi de que valia a pena reunir mesmo sem ele, para não travar o andamento de três frentes que já estavam paradas.",
          "Participaram Fred, Yuri e Débora. Ficou definido que todas as ações dos três projetos tratados são do Marketing, que executa na sequência — a analista da área não participou desta reunião."
        ]
      },
      {

/* ═══ SINCRONIZAÇÃO ═══════════════════════════════════════════════════════ */

let remoto = {};              // id -> {feita, prazo, atualizado_por, atualizado_em}
let salvando = new Set();     // ids com gravação em voo
let cliente = null;
let modoPolling = false;

const identInput = document.getElementById("ident");
const identField = document.getElementById("ident-field");
identInput.value = localStorage.getItem("hc-quem") || "";
identField.classList.toggle("vazio", !identInput.value.trim());
identInput.addEventListener("input", () => {
  localStorage.setItem("hc-quem", identInput.value.trim());
  identField.classList.toggle("vazio", !identInput.value.trim());
});
const quemSou = () => identInput.value.trim() || null;

function conexao(estado, texto) {
  const c = document.getElementById("conn");
  c.className = "conn " + estado;
  document.getElementById("conn-txt").textContent = texto;
}

function mostrarErro(msg) {
  const e = document.getElementById("erro");
  document.getElementById("erro-txt").textContent = msg;
  e.classList.add("on");
  clearTimeout(mostrarErro._t);
  mostrarErro._t = setTimeout(() => e.classList.remove("on"), 6000);
}

const headers = () => ({
  "apikey": SUPABASE_ANON,
  "Authorization": "Bearer " + SUPABASE_ANON,
  "Content-Type": "application/json"
});

async function buscarTudo() {
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + TABELA + "?select=*", { headers: headers() });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const linhas = await r.json();
  remoto = {};
  linhas.forEach(l => { remoto[l.id] = l; });
}

async function salvar(id, patch) {
  const anterior = remoto[id] ? { ...remoto[id] } : null;

  // otimista: aplica na hora, desfaz se falhar
  remoto[id] = Object.assign({ id: id, feita: false, prazo: null }, remoto[id], patch, {
    atualizado_por: quemSou(),
    atualizado_em: new Date().toISOString()
  });
  salvando.add(id);
  redesenhar();

  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/" + TABELA, {
      method: "POST",
      headers: Object.assign(headers(), { "Prefer": "resolution=merge-duplicates,return=representation" }),
      body: JSON.stringify([{
        id: id,
        feita: remoto[id].feita,
        prazo: remoto[id].prazo,
        atualizado_por: quemSou()
      }])
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const [linha] = await r.json();
    if (linha) remoto[id] = linha;
  } catch (e) {
    if (anterior) remoto[id] = anterior; else delete remoto[id];
    mostrarErro("Não consegui salvar. Verifique a conexão e tente de novo.");
  } finally {
    salvando.delete(id);
    redesenhar();
  }
}

async function iniciar() {
  try {
    await buscarTudo();
    conexao("on", "ao vivo");
    redesenhar();
  } catch (e) {
    conexao("off", "sem conexão");
    mostrarErro("Não consegui carregar os dados.");
    redesenhar();
    setTimeout(iniciar, 5000);
    return;
  }

  if (window.supabase && window.supabase.createClient) {
    cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    cliente.channel("hc-acoes")
      .on("postgres_changes", { event: "*", schema: "public", table: TABELA }, payload => {
        if (payload.new && payload.new.id) {
          if (salvando.has(payload.new.id)) return;   // não atropela gravação própria
          remoto[payload.new.id] = payload.new;
          redesenhar();
        }
      })
      .subscribe(status => {
        if (status === "SUBSCRIBED") conexao("on", "ao vivo");
        else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") ativarPolling();
      });
  } else {
    ativarPolling();
  }

  // rede de segurança: recarrega ao voltar para a aba
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) buscarTudo().then(redesenhar).catch(() => {});
  });
}

function ativarPolling() {
  if (modoPolling) return;
  modoPolling = true;
  conexao("slow", "atualiza a cada 5s");
  setInterval(() => {
    buscarTudo().then(redesenhar).catch(() => conexao("off", "sem conexão"));
  }, 5000);
}

/* estado efetivo de uma ação = o que está no banco por cima do que veio da ata */
const viva = a => {
  const r = remoto[a.id];
  return {
    ...a,
    feita: r ? !!r.feita : false,
    prazo: (r && r.prazo) || a.prazo,
    quem: r ? r.atualizado_por : null,
    quando: r ? r.atualizado_em : null,
    salvando: salvando.has(a.id)
  };
};
const acoesDe = p => p.acoes.map(viva);

/* ═══ DATAS ═══════════════════════════════════════════════════════════════ */

const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const DIAS_SEMANA = ["dom","seg","ter","qua","qui","sex","sáb"];

const parseDate = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); };
const hoje = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const fmtCurto = iso => { const d = parseDate(iso); return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0"); };
const fmtLongo = iso => { const d = parseDate(iso); return String(d.getDate()).padStart(2,"0") + " " + MESES[d.getMonth()] + " · " + DIAS_SEMANA[d.getDay()]; };
const diasAte = iso => Math.round((parseDate(iso) - hoje()) / 86400000);

function severidade(iso) {
  if (!iso) return "idle";
  const d = diasAte(iso);
  if (d < 0) return "late";
  if (d <= 14) return "warn";
  return "ok";
}
function textoPrazo(iso) {
  const d = diasAte(iso);
  if (d < 0) return "há " + Math.abs(d) + (Math.abs(d) === 1 ? " dia" : " dias");
  if (d === 0) return "hoje";
  if (d === 1) return "amanhã";
  return "em " + d + " dias";
}
function desde(ts) {
  const min = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (min < 1) return "agora";
  if (min < 60) return "há " + min + " min";
  const h = Math.round(min / 60);
  if (h < 24) return "há " + h + "h";
  const d = Math.round(h / 24);
  return "há " + d + (d === 1 ? " dia" : " dias");
}

function proximaAcao(p) {
  const abertas = acoesDe(p).map((a, i) => ({ a, i })).filter(x => !x.a.feita);
  if (!abertas.length) return null;
  const peso = x => x.a.status === "bloqueia" ? -1e6 : (x.a.prazo ? diasAte(x.a.prazo) : 1e5);
  abertas.sort((x, y) => (peso(x) - peso(y)) || (x.i - y.i));
  return abertas[0].a;
}

function el(tag, cls, txt) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}

/* ═══ COMPONENTES ═════════════════════════════════════════════════════════ */

function campoData(a) {
  const cell = el("div", "prazo-cell");

  const wrap = el("label", "dateedit" + (a.prazo ? "" : " empty"));
  const input = document.createElement("input");
  input.type = "date";
  input.value = a.prazo || "";
  input.setAttribute("aria-label", "Prazo de: " + a.o);
  input.addEventListener("change", () => salvar(a.id, { prazo: input.value || null }));
  input.addEventListener("click", e => e.stopPropagation());
  wrap.append(input);
  cell.append(wrap);

  if (!a.prazo && a.prazoTxt) cell.append(el("span", "prazo-hint", a.prazoTxt));
  if (a.prazo) {
    const sev = a.feita ? "ok" : severidade(a.prazo);
    cell.append(el("span", "chip " + sev, a.feita ? "Feita" : textoPrazo(a.prazo)));
  } else if (a.status === "bloqueia" && !a.feita) {
    cell.append(el("span", "chip late", "Bloqueia"));
  }
  return cell;
}

function listaAcoes(acoes) {
  const box = el("div", "acoes");

  acoes.forEach(a => {
    const row = el("div", "acao"
      + (a.feita ? " feita" : "")
      + (a.status === "bloqueia" ? " bloqueia" : "")
      + (a.salvando ? " salvando" : ""));

    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "acao-check";
    cb.checked = a.feita;
    cb.setAttribute("aria-label", "Marcar como feita: " + a.o);
    cb.addEventListener("change", () => salvar(a.id, { feita: cb.checked }));
    row.append(cb);

    row.append(el("div", "acao-txt", a.o));

    const meta = el("div", "acao-meta");
    meta.append(campoData(a));
    if (a.quando) {
      const quem = a.quem ? a.quem : "alguém";
      meta.append(el("div", "acao-quem", "por " + quem + " · " + desde(a.quando)));
    }
    row.append(meta);

    box.append(row);
  });

  return box;
}

/* ═══ RENDER ══════════════════════════════════════════════════════════════ */

function renderCards() {
  const box = document.getElementById("cards");
  box.replaceChildren();

  PROJETOS.forEach(p => {
    const acoes = acoesDe(p);
    const abertas = acoes.filter(a => !a.feita);
    const bloqueado = abertas.some(a => a.status === "bloqueia");
    const prox = proximaAcao(p);

    const card = el("button", "card");
    card.type = "button";
    card.setAttribute("aria-label", "Abrir " + p.nome);

    const top = el("div", "card-top");
    top.append(el("h3", "card-title", p.nome));

    let chipTxt, chipCls;
    if (!abertas.length)         { chipTxt = "Concluído"; chipCls = "ok"; }
    else if (bloqueado)          { chipTxt = "Bloqueado"; chipCls = "late"; }
    else if (prox && prox.prazo) {
      const d = diasAte(prox.prazo);
      chipTxt = d < 0 ? "Atrasado" : (d <= 14 ? "Próximo" : "No prazo");
      chipCls = severidade(prox.prazo);
    } else                       { chipTxt = "Sem data"; chipCls = "idle"; }
    top.append(el("span", "chip " + chipCls, chipTxt));
    card.append(top);

    card.append(el("p", "card-summary", p.resumo));

    const next = el("div", "card-next" + (prox ? "" : " done"));
    next.append(el("span", "next-label", prox ? "Próxima ação" : "Situação"));
    if (prox) {
      next.append(el("span", "next-when",
        prox.prazo ? fmtLongo(prox.prazo) + " · " + textoPrazo(prox.prazo)
                   : (prox.status === "bloqueia" ? "sem data · está travando o projeto" : "sem data · " + (prox.prazoTxt || "a definir"))));
      next.append(el("span", "next-what", prox.o));
    } else {
      next.append(el("span", "next-what", "Todas as ações foram marcadas como feitas."));
    }
    card.append(next);

    const foot = el("div", "card-foot");
    const feitas = acoes.length - abertas.length;
    foot.append(el("span", "open-count", feitas + " de " + acoes.length + " feitas"));
    foot.append(el("span", "card-cta", "Abrir →"));
    card.append(foot);

    card.addEventListener("click", () => abrirProjeto(p));
    box.append(card);
  });
}

function renderMeetings() {
  const box = document.getElementById("meetings");
  box.replaceChildren();
  REUNIOES.forEach(r => {
    const total = PROJETOS.reduce((s,p) => s + p.acoes.filter(a => a.reuniao === r.id).length, 0);
    const row = el("button", "meeting");
    row.type = "button";
    row.append(el("span", "meeting-date", fmtLongo(r.data)));
    const body = el("div", "meeting-body");
    body.append(el("div", "meeting-title", r.titulo));
    body.append(el("div", "meeting-meta", r.participantes + " · ausente: " + r.ausentes + " · " + total + " ações"));
    row.append(body);
    row.append(el("span", "meeting-cta", "Ver ata completa →"));
    row.addEventListener("click", () => abrirReuniao(r));
    box.append(row);
  });
}

/* ── Diálogo ── */
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheet-body");
const sheetTitle = document.getElementById("sheet-title");
const sheetOrigin = document.getElementById("sheet-origin");
let sheetAtual = null;

document.getElementById("sheet-close").addEventListener("click", () => sheet.close());
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });
sheet.addEventListener("close", () => { sheetAtual = null; });

function abrirProjeto(p) {
  sheetAtual = { tipo: "projeto", ref: p };
  sheetOrigin.textContent = "Projeto";
  sheetTitle.textContent = p.nome;
  sheetBody.replaceChildren();

  sheetBody.append(el("h3", null, "O que foi falado"));
  p.detalhe.forEach(par => sheetBody.append(el("p", "resumo", par)));

  sheetBody.append(el("h3", null, "Ações e prazos"));
  sheetBody.append(el("p", "owner-note", "Todas do " + p.responsavel + ". O que você marcar aqui aparece para todo mundo na hora."));
  sheetBody.append(listaAcoes(acoesDe(p)));

  if (p.abertos && p.abertos.length) {
    sheetBody.append(el("h3", null, "Ainda em aberto"));
    const ul = el("ul", "openlist");
    p.abertos.forEach(o => ul.append(el("li", null, o)));
    sheetBody.append(ul);
  }

  REUNIOES.filter(r => r.ata.some(s => s.projetoId === p.id)).forEach(r => {
    const b = el("button", "linkata");
    b.type = "button";
    b.textContent = "Ler a ata completa de " + fmtCurto(r.data) + " neste assunto →";
    b.addEventListener("click", () => abrirReuniao(r, p.id));
    sheetBody.append(b);
  });

  if (!sheet.open) { sheet.showModal(); sheetBody.scrollTop = 0; }
}

function abrirReuniao(r, ancora, rolar) {
  sheetAtual = { tipo: "reuniao", ref: r, ancora: ancora };
  sheetOrigin.textContent = "Ata completa · " + fmtLongo(r.data) + " de " + parseDate(r.data).getFullYear();
  sheetTitle.textContent = r.titulo;
  sheetBody.replaceChildren();

  sheetBody.append(el("h3", null, "Presentes"));
  sheetBody.append(el("p", "resumo", r.participantes + ". Ausente: " + r.ausentes + "."));

  const doc = el("div", "ata-doc");

  r.ata.forEach((sec, idx) => {
    const bloco = el("section", "ata-sec" + (ancora && ancora === sec.projetoId ? " alvo" : ""));
    bloco.id = "ata-" + sec.id;

    const h = el("h4", null, sec.titulo);
    const p = sec.projetoId ? PROJETOS.find(x => x.id === sec.projetoId) : null;
    if (p) h.append(el("span", "chip brand", p.nome));
    bloco.append(h);

    sec.paragrafos.forEach(par => bloco.append(el("p", null, par)));

    const ehUltimaDoProjeto = p && !r.ata.slice(idx + 1).some(s => s.projetoId === sec.projetoId);
    if (ehUltimaDoProjeto) {
      const acoes = acoesDe(p).filter(a => a.reuniao === r.id);
      if (acoes.length) {
        bloco.append(el("h3", null, "Ações · " + p.responsavel));
        bloco.append(listaAcoes(acoes));
      }
    }
    doc.append(bloco);
  });

  sheetBody.append(doc);

  if (!sheet.open) { sheet.showModal(); sheetBody.scrollTop = 0; }

  if (ancora && rolar !== false) {
    const alvo = r.ata.find(s => s.projetoId === ancora);
    if (alvo) {
      const node = sheetBody.querySelector("#ata-" + alvo.id);
      if (node) requestAnimationFrame(() => node.scrollIntoView({ block: "start", behavior: "instant" }));
    }
  }
}

function redesenhar() {
  renderCards();
  if (sheetAtual) {
    const topo = sheetBody.scrollTop;
    if (sheetAtual.tipo === "projeto") abrirProjeto(sheetAtual.ref);
    else abrirReuniao(sheetAtual.ref, sheetAtual.ancora, false);
    sheetBody.scrollTop = topo;
  }
}

renderMeetings();
redesenhar();
iniciar();
</script>
