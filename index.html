<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Reuniões Holy Cook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">

<link rel="stylesheet" href="base.css">
</head>
<body>

<div class="wrap">

  <header class="masthead">
    <div class="monogram">HC</div>
    <div class="masthead-text">
      <span class="eyebrow">Holy Cook</span>
      <h1>Reuniões &amp; Projetos</h1>
    </div>
    <div class="ident">
      <span class="ident-field vazio" id="ident-field">
        <label for="ident">Você é</label>
        <input id="ident" type="text" placeholder="seu nome" autocomplete="off" maxlength="24">
      </span>
      <span class="conn" id="conn"><span class="conn-dot"></span><span id="conn-txt">conectando…</span></span>
    </div>
  </header>

  <section class="section">
    <div class="section-head">
      <h2>Projetos</h2>
      <span class="hint">Toque para ver o que foi falado e as ações</span>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Reuniões</h2>
      <span class="hint">A ata completa de cada uma</span>
    </div>
    <div class="meetings" id="meetings"></div>
  </section>

  <p class="footnote">O que você marcar aqui é salvo para todo mundo, na hora. Qualquer pessoa com este link pode editar.</p>

</div>

<div class="erro" id="erro"><span id="erro-txt"></span></div>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="sheet-head">
      <div style="flex:1; min-width:0">
        <div class="sheet-origin" id="sheet-origin"></div>
        <h2 id="sheet-title"></h2>
      </div>
      <button class="close" id="sheet-close" aria-label="Fechar">&times;</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="dados.js"></script>
<script src="app.js"></script>
<script src="render-home.js"></script>
</body>
</html>
