<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Produtos Desejáveis · Holy Cookie</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍪</text></svg>">
<link rel="stylesheet" href="../base.css">
<style>
  :root { --maxw: 1120px; }
  .masthead { align-items: flex-start; }
  .masthead h1 { font-size: clamp(24px, 4vw, 34px); }
  .voltar { color: var(--accent); font-size: 12.5px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .voltar:hover { text-decoration: underline; }
  .tabs { position: sticky; top: 0; z-index: 20; display: flex; gap: 8px; padding: 12px 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .tab { border: 1px solid var(--line-2); border-radius: 100px; padding: 9px 16px; background: var(--surface); color: var(--ink-2); font: 600 13px var(--font-body); cursor: pointer; text-decoration: none; white-space: nowrap; }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .panel { padding-top: 28px; }
  .intro { max-width: 780px; margin-bottom: 28px; }
  .intro .kicker, .label { font: 10.5px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .intro h2 { margin-top: 5px; font: 600 clamp(26px, 4vw, 42px)/1.08 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
  .intro p { margin-top: 12px; color: var(--ink-2); font-size: 15.5px; line-height: 1.65; }
  .dimensions-intro { max-width: 760px; margin: 34px 0 15px; }
  .dimensions-intro h3 { margin-top: 4px; font: 600 24px var(--font-display); }
  .dimensions-intro p { margin-top: 6px; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
  .manifesto { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 0 34px; }
  .manifesto-card { position: relative; overflow: hidden; min-height: 160px; border: 1px solid var(--line); border-radius: 14px; padding: 20px; background: var(--surface); box-shadow: var(--shadow-1); }
  .manifesto-card::after { content: attr(data-n); position: absolute; right: 12px; bottom: -32px; font: 700 100px var(--font-display); color: var(--surface-2); z-index: 0; }
  .manifesto-card > * { position: relative; z-index: 1; }
  .manifesto-card .emoji { font-size: 25px; }
  .manifesto-card h3 { margin-top: 14px; font: 600 19px var(--font-display); }
  .manifesto-card strong { display: block; margin-top: 2px; color: var(--accent); font-size: 13px; }
  .manifesto-card p { margin-top: 7px; color: var(--ink-2); font-size: 13px; }
  .brief-section { margin: 38px 0; }
  .brief-head { display: flex; gap: 12px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .brief-num { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 700 12px var(--font-mono); }
  .brief-head h3 { font: 600 22px var(--font-display); }
  .brief-question { margin: 16px 0; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 650; }
  .element-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 10px; }
  .element-grid.six { grid-template-columns: repeat(3, 1fr); }
  .element { border: 1px solid var(--line); border-radius: 10px; padding: 15px; background: var(--surface); }
  .element h4 { font: 600 16px var(--font-display); }
  .element p { margin-top: 5px; color: var(--ink-2); font-size: 12.8px; }
  .test { margin-top: 12px; color: var(--ink-2); font-size: 13px; }
  .test b { color: var(--ink); }
  .principio { margin: 38px 0 10px; border: 1px solid var(--accent); border-radius: 14px; padding: 24px; background: var(--surface); text-align: center; }
  .principio h3 { font: 600 24px var(--font-display); }
  .principio .troca { margin-top: 12px; color: var(--ink-2); }
  .principio .troca strong { color: var(--accent); }

  .product-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: start; }
  .product-tabs { position: sticky; top: 70px; display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 96px); overflow: auto; padding-right: 6px; }
  .product-tab { display: grid; grid-template-columns: 28px 1fr; gap: 9px; align-items: center; width: 100%; border: 1px solid transparent; border-radius: 9px; padding: 9px 10px; background: transparent; color: var(--ink-2); font: 600 12.5px/1.25 var(--font-body); text-align: left; cursor: pointer; }
  .product-tab:hover { background: var(--surface-2); color: var(--ink); }
  .product-tab.on { background: var(--surface); border-color: var(--line-2); color: var(--accent); box-shadow: var(--shadow-1); }
  .product-tab .n { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 7px; background: var(--surface-2); font: 700 10px var(--font-mono); }
  .product-tab.on .n { background: var(--accent); color: #fff; }
  .product-photo { position: relative; display: grid; place-items: center; height: min(58vh, 560px); min-height: 390px; margin-bottom: 24px; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); box-shadow: var(--shadow-1); }
  .product-photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .product-photo figcaption { position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 24px); border-radius: 100px; padding: 6px 11px; background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--ink-2); font: 10.5px var(--font-mono); box-shadow: var(--shadow-1); }
  .product-hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(180px, .6fr); gap: 20px; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
  .product-hero h2 { margin-top: 6px; font: 600 clamp(28px, 5vw, 45px)/1.05 var(--font-display); letter-spacing: -.025em; }
  .product-hero .base { margin-top: 12px; color: var(--ink-2); font-size: 14.5px; line-height: 1.65; }
  .direction { align-self: stretch; border-radius: 12px; padding: 17px; background: var(--accent-soft); color: var(--accent-ink); }
  .direction span { font: 10px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; }
  .direction p { margin-top: 7px; font: 600 16px/1.4 var(--font-display); }
  .dimensions { display: grid; gap: 14px; margin-top: 22px; }
  .dimension { border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: var(--shadow-1); overflow: hidden; }
  .dimension-head { display: grid; grid-template-columns: 42px 1fr; gap: 12px; padding: 18px 20px 15px; border-bottom: 1px solid var(--line); }
  .dimension-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 10px; background: var(--surface-2); font-size: 22px; }
  .dimension h3 { font: 600 19px var(--font-display); }
  .dimension-head p { color: var(--ink-2); font-size: 12.5px; }
  .ideas { display: grid; grid-template-columns: repeat(3, 1fr); }
  .idea { padding: 15px 18px 17px; border-right: 1px solid var(--line); }
  .idea:last-child { border-right: 0; }
  .idea h4 { font: 700 10px var(--font-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
  .idea ul { margin: 9px 0 0 17px; }
  .idea li { margin-top: 6px; font-size: 13px; line-height: 1.45; }
  .scene { margin: 0 18px 18px; padding: 11px 13px; border-radius: 8px; background: var(--surface-2); font-size: 12.5px; color: var(--ink-2); }
  .scene b { color: var(--ink); }
  .evaluation { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 26px; }
  .evaluation-head { display: flex; justify-content: space-between; gap: 12px; align-items: end; }
  .evaluation h3 { font: 600 23px var(--font-display); }
  .evaluation-head p { color: var(--ink-3); font-size: 12px; }
  .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .score-card { border: 1px solid var(--line); border-radius: 10px; padding: 14px; background: var(--surface); }
  .score-card label { display: block; font-size: 12px; font-weight: 650; }
  .score-card select { width: 100%; margin-top: 8px; border: 1px solid var(--line-2); border-radius: 8px; padding: 9px; background: var(--bg); color: var(--ink); font: 13px var(--font-body); }
  .notes { margin-top: 10px; }
  .notes label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 650; }
  .notes textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line-2); border-radius: 10px; padding: 12px; background: var(--surface); color: var(--ink); font: 14px/1.5 var(--font-body); }
  .save-state { min-height: 18px; margin-top: 6px; color: var(--ok); font: 10.5px var(--font-mono); }
  .footnote { margin-top: 45px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 11.5px; text-align: center; }
  @media (max-width: 800px) {
    .manifesto { grid-template-columns: 1fr; }
    .manifesto-card { min-height: 130px; }
    .product-layout { grid-template-columns: 1fr; }
    .product-tabs { position: static; flex-direction: row; overflow-x: auto; padding: 0 0 8px; scroll-snap-type: x mandatory; }
    .product-tab { min-width: 175px; scroll-snap-align: start; }
    .product-hero { grid-template-columns: 1fr; }
    .ideas, .score-grid { grid-template-columns: 1fr; }
    .element-grid.six { grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); }
    .idea { border-right: 0; border-bottom: 1px solid var(--line); }
    .idea:last-child { border-bottom: 0; }
  }
  @media (max-width: 560px) {
    .wrap { padding-inline: 16px; }
    .masthead { padding-top: 20px; }
    .masthead .ident { width: 100%; }
    .tabs { overflow-x: auto; }
    .tab { white-space: nowrap; }
    .panel { padding-top: 22px; }
    .product-hero h2 { font-size: 34px; }
    .product-photo { height: 68vh; min-height: 440px; }
    .dimension-head { padding-inline: 15px; }
    .idea { padding-inline: 15px; }
  }
</style>
</head>

function h(tag, cls, text) {
  const node = document.createElement(tag);

function dimensionCard(d, groups, scene) {
  const card = h("section", "dimension");

  const txt = h("div"); txt.append(h("h3", null, d.nome + " — " + d.promessa)); txt.append(h("p", null, d.elementos.join(" · "))); head.append(txt); card.append(head);
  const ideas = h("div", "ideas");
  const labels = d.id === "performatico" ? ["Como construir a ação", "Como construir o reveal", "Como construir o gooey"] : d.elementos;
  labels.forEach((elemento, i) => {
    const idea = h("div", "idea"); idea.append(h("h4", null, elemento)); const ul = h("ul"); (groups[i] || []).forEach(x => ul.append(h("li", null, x))); idea.append(ul); ideas.append(idea);
  });

function storageKey(id) { return "hc-produto-desejavel:" + id; }
function saved(id) { try { return JSON.parse(localStorage.getItem(storageKey(id))) || {}; } catch { return {}; } }
function saveEvaluation(produto, wrap) {
  const data = { notes: wrap.querySelector("textarea").value };
  wrap.querySelectorAll("select").forEach(s => data[s.dataset.dim] = s.value);
  localStorage.setItem(storageKey(produto.id), JSON.stringify(data));
  const state = wrap.querySelector(".save-state"); state.textContent = "Salvo neste navegador";
  clearTimeout(saveEvaluation._t); saveEvaluation._t = setTimeout(() => state.textContent = "", 1800);
}

function evaluation(produto) {
  const data = saved(produto.id), box = h("section", "evaluation");
  const head = h("div", "evaluation-head"); const title = h("div"); title.append(h("span", "label", "Ficha de avaliação")); title.append(h("h3", null, "O que sobrevive ao teste?")); head.append(title); head.append(h("p", null, "1 = fraco · 5 = excepcional")); box.append(head);
  const grid = h("div", "score-grid");
  DIMENSOES.forEach(d => {
    const card = h("div", "score-card"); const label = h("label", null, d.icon + " " + d.nome + " — " + d.promessa); label.htmlFor = "score-" + d.id; card.append(label);
    const select = h("select"); select.id = "score-" + d.id; select.dataset.dim = d.id;
    [["", "Ainda não avaliado"], ["1", "1 · Fraco"], ["2", "2 · Precisa mudar"], ["3", "3 · Promissor"], ["4", "4 · Forte"], ["5", "5 · Excepcional"]].forEach(o => { const opt = h("option", null, o[1]); opt.value = o[0]; select.append(opt); });
    select.value = data[d.id] || ""; card.append(select); grid.append(card);
  });
  box.append(grid);
  const notes = h("div", "notes"); const label = h("label", null, "Decisões, alterações e próximos testes"); label.htmlFor = "product-notes"; notes.append(label);
  const textarea = h("textarea"); textarea.id = "product-notes"; textarea.placeholder = "Ex.: manter o reveal, reduzir a calda, testar a versão com maracujá…"; textarea.value = data.notes || ""; notes.append(textarea); box.append(notes);
  box.append(h("div", "save-state")); box.addEventListener("input", () => saveEvaluation(produto, box)); box.addEventListener("change", () => saveEvaluation(produto, box));
  return box;
}

  const layout = h("div", "product-layout"); const nav = h("nav", "product-tabs"); nav.setAttribute("aria-label", "Produtos");
  PRODUTOS.forEach((produto, i) => {
    const btn = h("button", "product-tab" + (produto.id === p.id ? " on" : "")); btn.type = "button"; btn.append(h("span", "n", String(i + 1).padStart(2, "0"))); btn.append(h("span", null, produto.nome));
    btn.addEventListener("click", () => { produtoAtual = produto.id; history.replaceState(null, "", "#produtos/" + produtoAtual); renderProdutos(); window.scrollTo({ top: 0, behavior: "instant" }); }); nav.append(btn);
  });
  layout.append(nav);
  const content = h("article", "product-content");
  const figure = h("figure", "product-photo"); const img = document.createElement("img"); img.src = p.foto; img.alt = "Referência visual de " + p.nome; img.loading = "eager"; figure.append(img); figure.append(h("figcaption", null, p.fotoNota || "Foto de referência do produto")); content.append(figure);
  const hero = h("header", "product-hero"); const title = h("div"); title.append(h("span", "label", "Produto " + String(PRODUTOS.indexOf(p) + 1).padStart(2, "0") + " de " + PRODUTOS.length)); title.append(h("h2", null, p.nome)); title.append(h("p", "base", p.base)); hero.append(title);
  const direction = h("aside", "direction"); direction.append(h("span", null, "Direção sugerida")); direction.append(h("p", null, p.direcao)); hero.append(direction); content.append(hero);
  const dims = h("div", "dimensions"); dims.append(dimensionCard(DIMENSOES[0], p.performance, p.cena)); dims.append(dimensionCard(DIMENSOES[1], p.visual)); dims.append(dimensionCard(DIMENSOES[2], p.taste)); content.append(dims); content.append(evaluation(p)); layout.append(content); panel.replaceChildren(layout);
}

function redraw() {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.panel === abaAtual));
  if (abaAtual === "briefing") renderBriefing(); else renderProdutos();
}
document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
  abaAtual = btn.dataset.panel; history.replaceState(null, "", abaAtual === "produtos" ? "#produtos/" + produtoAtual : "#briefing"); redraw(); window.scrollTo({ top: 0, behavior: "instant" });
}));
window.addEventListener("hashchange", () => { const [tab, product] = location.hash.slice(1).split("/"); if (["briefing", "produtos"].includes(tab)) abaAtual = tab; if (PRODUTOS.some(p => p.id === product)) produtoAtual = product; redraw(); });
redraw();
</script>
</body>
</html>
