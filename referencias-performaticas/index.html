<style>
  :root { --maxw: 1120px; }
  .masthead { align-items: flex-start; }

  .voltar:hover { text-decoration: underline; }
  .tabs { position: sticky; top: 0; z-index: 20; display: flex; gap: 8px; padding: 12px 0; overflow-x: auto; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .tab { flex: none; border: 1px solid var(--line-2); border-radius: 100px; padding: 9px 16px; background: var(--surface); color: var(--ink-2); font: 600 13px var(--font-body); cursor: pointer; }
  .tab:hover { border-color: var(--accent); color: var(--accent); }

  .label { font: 10.5px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  .intro h2 { margin-top: 6px; font: 600 clamp(30px, 5vw, 48px)/1.06 var(--font-display); letter-spacing: -.025em; text-wrap: balance; }

  .formula-card p { margin-top: 5px; color: var(--ink-2); font-size: 12.8px; }
  .arrow { color: var(--accent); font-size: 24px; }

  .section-title h2 { margin-top: 4px; font: 600 29px var(--font-display); }

  .ref-tab:hover { background: var(--surface-2); color: var(--ink); }

  .question { border-top: 3px solid var(--accent); border-radius: 0 0 10px 10px; padding: 17px; background: var(--surface); box-shadow: var(--shadow-1); }
  .question span { font: 700 10px var(--font-mono); color: var(--accent); }
  .question h3 { margin-top: 9px; font: 600 18px var(--font-display); }
  .question p { margin-top: 5px; color: var(--ink-2); font-size: 12.5px; }
  .closing { margin: 34px 0 10px; border: 1px solid var(--accent); border-radius: 14px; padding: 24px; background: var(--surface); text-align: center; }

  .footnote { margin-top: 45px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 11.5px; text-align: center; }
  @media (max-width: 800px) {

    .refs-layout { grid-template-columns: 1fr; }
    .ref-tabs { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 8px; }
    .ref-tab { min-width: 175px; }
    .library, .questions { grid-template-columns: 1fr 1fr; }

  @media (max-width: 560px) {
    .wrap { padding-inline: 16px; }

    .masthead .ident { width: 100%; }
    .panel { padding-top: 22px; }
    .ref-hero, .ref-grid { grid-template-columns: 1fr; }
    .chips { justify-content: flex-start; }
    .library, .questions { grid-template-columns: 1fr; }
    .media-link { grid-template-columns: 44px 1fr; }
    .media-link .play { width: 42px; height: 42px; }
    .media-link > span:last-child { display: none; }
  }
</style>

<script>
const REFS = [
  { id:"formaggio", nome:"Spaghetti Al Formaggio", fonte:"La Nonna di Lucca · São Paulo", mecanismos:["Transformação"], acao:"Misturar, raspar e incorporar", seq:"Aquecer → derreter → misturar → incorporar → levantar → servir", acontece:"A massa quente é finalizada diante do cliente utilizando uma grande peça de queijo. Ingredientes separados se transformam no prato final em uma pequena coreografia gastronômica.", atencao:"Não existe apenas um momento interessante. A pessoa entende que algo está sendo preparado e acompanha a sequência até a recompensa final.", principio:"Uma etapa da preparação pode acontecer diante da câmera ou do cliente. O produto não precisa chegar completamente finalizado.", video:"youtube", videoId:"1jylFLINt1I", url:"https://youtu.be/1jylFLINt1I" },
  { id:"raclette", nome:"Raclette", fonte:"Queijo derretido e raspado", mecanismos:["Derretimento","Cascata"], acao:"Raspar", seq:"Aquecer → derreter → inclinar → raspar → cair", acontece:"Uma grande peça de queijo é aquecida até borbulhar. Depois, a camada derretida é raspada e cai inteira sobre o produto.", atencao:"Existe antecipação. A pessoa vê o queijo derretendo e sabe que, em algum momento, toda aquela camada vai cair. A gravidade faz parte da performance.", principio:"Algo pode ser preparado acima do produto para depois cair sobre ele. Coberturas podem acontecer diante da pessoa. O Bolo Matilda, na próxima referência, demonstra esse mecanismo em uma sobremesa.", video:"none" },
  { id:"matilda", nome:"Bolo Matilda + raclette de chocolate", fonte:"Pecatto · São Paulo", mecanismos:["Gooey","Cascata","Derretimento"], acao:"Derramar e raspar", seq:"Aquecer → derreter → raspar → cair → cobrir → escorrer", acontece:"A fatia recebe chocolate quente preparado em um equipamento semelhante a uma raclette. Uma etapa que ficaria na cozinha vira espetáculo na mesa.", atencao:"O equipamento gera a pergunta “o que vai acontecer?”. A antecipação começa antes de o chocolate cair, e o escorrer prolonga a recompensa.", principio:"Retirar uma etapa da cozinha e transformá-la em performance. Separar os elementos pode tornar filmável um sabor que seria o mesmo já montado.", video:"instagram", videoId:"DRVdhJnDwz-", url:"https://www.instagram.com/reel/DRVdhJnDwz-/" },
  { id:"cupula-reveal", nome:"Cúpula de chocolate + calda quente", fonte:"Reveal de sorvete", mecanismos:["Derretimento","Transformação","Reveal"], acao:"Derramar", seq:"Calda quente → casca amolece → estrutura cede → sorvete aparece", acontece:"Uma estrutura fechada de chocolate esconde completamente o sorvete. A calda quente é derramada por cima, amolece a cobertura e faz a cúpula perder a forma até revelar o interior gelado.", atencao:"A pessoa sabe que existe algo escondido, mas não sabe exatamente quando nem como ele aparecerá. O derretimento é progressivo e sustenta a atenção até a recompensa final.", principio:"Construir uma cobertura que não seja apenas decoração: ela precisa esconder, reagir à temperatura e desaparecer para revelar outro produto.", video:"short", videoId:"PiMMTH69Ukc", url:"https://www.youtube.com/shorts/PiMMTH69Ukc" },
  { id:"flambe", nome:"Flambé", fonte:"Fogo como transformação", mecanismos:["Fogo","Transformação","Sensorial"], acao:"Flambar", seq:"Preparar → acender → chama subir → apagar → revelar", acontece:"O prato é finalizado diante do cliente com uma transformação instantânea. A chama sobe, desaparece e revela o produto final.", atencao:"É impossível ignorar. Uma mesa pede, outras mesas veem e a atenção se espalha pelo salão. O acontecimento ultrapassa quem comprou.", principio:"Criar uma transformação instantânea e perceptível. Fogo real só pode ser considerado após avaliação operacional e de segurança.", video:"link", url:"https://www.youtube.com/results?search_query=dessert+flambe+tableside", linkLabel:"Ver referências de flambé" },
  { id:"souffle-flambe", nome:"Soufflé flambado + sorvete", fonte:"Soufflé de chocolate · sorvete de frutas", mecanismos:["Fogo","Sensorial","Quente + frio"], acao:"Derramar e flambar", seq:"Soufflé quente → caldo → sorvete → acender → chama envolver → apagar", acontece:"Uma massa quente recebe um caldo, leva uma bola de sorvete por cima e é flambada. O fogo envolve elementos de temperaturas e consistências opostas no mesmo produto.", atencao:"A chama é instantânea e impossível de ignorar, mas a construção continua interessante depois que ela apaga: massa quente, líquido e sorvete começam a se transformar juntos.", principio:"O fogo pode ser apenas o gatilho. A performance fica mais rica quando ele ativa uma mudança real no produto — derreter o sorvete, aquecer o caldo e unir texturas.", video:"short", videoId:"dtG_MKqXNIE", url:"https://www.youtube.com/shorts/dtG_MKqXNIE" },
  { id:"crosta", nome:"Peixe na crosta de sal", fonte:"Destruir para revelar", mecanismos:["Quebra","Reveal"], acao:"Quebrar", seq:"Bater → rachar → quebrar → abrir → retirar → revelar", acontece:"O alimento chega completamente escondido. É necessário destruir a camada externa para acessar a recompensa: um unboxing gastronômico.", atencao:"O mistério “o que tem aí dentro?” sustenta a atenção. A quebra é natural e a recompensa só existe depois dela.", principio:"Quebrar já é um comportamento natural do cookie. Podemos projetar a quebra deliberadamente para produzir uma grande recompensa visual.", video:"link", url:"https://www.youtube.com/results?search_query=salt+crusted+fish+tableside+restaurant", linkLabel:"Ver referências de crosta de sal" },
  { id:"souffle", nome:"Soufflé + calda", fonte:"Palo · Disney Cruise Line", mecanismos:["Preenchimento","Gooey","Transbordamento"], acao:"Abrir, preencher e derramar", seq:"Furar → abrir → derramar → preencher → espalhar → transbordar", acontece:"O produto chega inteiro. Uma abertura é feita no centro e a calda entra no produto, preenche seu interior e começa a transbordar.", atencao:"Diferente de apenas cobrir, aqui o líquido entra. A pessoa assiste à finalização e à transformação do interior naquele momento.", principio:"O recheio não precisa entrar na cozinha. Existe uma forma interessante de fazê-lo entrar no produto diante da câmera ou do cliente?", video:"short", videoId:"Yer__wxtY-M", url:"https://www.youtube.com/shorts/Yer__wxtY-M?feature=share" },
  { id:"fajita", nome:"Fajita na chapa", fonte:"Atenção multissensorial", mecanismos:["Sensorial"], acao:"Servir quente", seq:"Calor → chiado → vapor → aroma → atenção", acontece:"A chapa extremamente quente chega à mesa. O som vem antes da imagem, o vapor fica visível e o aroma se espalha pelo ambiente.", atencao:"A performance chama a atenção da loja inteira, não apenas de quem comprou. Ela amplia o conceito para além de gooey, reveal e quebra.", principio:"Pensar além da imagem. O produto produz som, vapor, aroma ou calor? Alguma coisa acontece quando ele chega?", video:"link", url:"https://www.azfamily.com/video/2022/04/13/sizzling-fajitas/", linkLabel:"Assistir à referência de fajitas" },
  { id:"mousse", nome:"Mousse gigante", fonte:"Chez Janou · Paris", mecanismos:["Escala","Generosidade"], acao:"Servir", seq:"Recipiente gigante → colherada → servir → abundância", acontece:"Um recipiente enorme chega à mesa e é servido em colheradas generosas. A quantidade deixa de ser apenas visual e vira um acontecimento.", atencao:"A reação é imediata: “olha o tamanho disso”. Um elemento normalmente visual — generosidade — torna-se performático quando levado ao extremo.", principio:"Escala e abundância também podem ser acontecimentos. Quantidade inesperada ou colherada exagerada podem transformar o serviço em conteúdo.", video:"instagram", videoId:"DZ-4o71tLYq", url:"https://www.instagram.com/reel/DZ-4o71tLYq/" }
];

const MECANISMOS = [
  ["Reveal","Alguma coisa aparece: quebrar → recheio aparece."],
  ["Gooey / Derretimento","Algo muda de estado, escorre, derrete ou estica."],
  ["Transformação","O produto muda diante da pessoa."],
  ["Queda / Cascata","Algo cai sobre outra coisa; a gravidade cria antecipação."],
  ["Quebra","É preciso destruir uma camada para acessar a recompensa."],
  ["Preenchimento / Transbordamento","Alguma coisa entra no produto ou começa a sair dele."],
  ["Escala / Abundância","A quantidade é tão inesperada que vira espetáculo."],
  ["Sensorial","Vapor, som, fumaça, aroma ou calor ampliam a performance."],
  ["Montagem / Interação","A finalização acontece diante ou pelas mãos da pessoa."]
];
const ACOES = ["Quebrar","Cortar","Puxar","Raspar","Derramar","Mergulhar","Apertar","Misturar","Levantar","Preencher","Aquecer","Esmagar","Separar","Montar","Abrir","Esticar"];
let painelAtual = (location.hash || "#conceito").slice(1).split("/")[0];
if (!["conceito","referencias","biblioteca"].includes(painelAtual)) painelAtual = "conceito";
let refAtual = location.hash.slice(1).split("/")[1] || REFS[0].id;
if (!REFS.some(r => r.id === refAtual)) refAtual = REFS[0].id;
const panel = document.getElementById("panel");
function h(tag, cls, text) { const n=document.createElement(tag); if(cls)n.className=cls; if(text!=null)n.textContent=text; return n; }

function introBlock(kicker, title, text) { const s=h("section","intro"); s.append(h("span","label",kicker)); s.append(h("h2",null,title)); if(text)s.append(h("p",null,text)); return s; }
function renderConceito() {
  const f=document.createDocumentFragment();
  f.append(introBlock("O foco agora é performance","Um produto performático contém um acontecimento visual.","Antes de desejar um produto, a pessoa precisa saber que ele existe. Por isso, queremos produtos que não sejam apenas bonitos ou gostosos: alguma coisa acontece quando interagimos com eles."));
  f.append(h("div","main-question","“Quando alguém interage com esse produto, acontece alguma coisa que faz outra pessoa querer assistir?”"));
  const formula=h("div","formula");
  [["01","Ação","O verbo: quebrar, cortar, puxar, derramar, misturar."],["02","Acontecimento","A recompensa: revelar, escorrer, cair, transformar, soltar vapor."],["03","Atenção","A pessoa para porque quer acompanhar até o final."]].forEach((x,i)=>{ const c=h("article","formula-card"); c.append(h("span","num",x[0])); c.append(h("h3",null,x[1])); c.append(h("p",null,x[2])); formula.append(c); if(i<2)formula.append(h("span","arrow","→")); });
  f.append(formula);
  const note=h("div","note"); note.innerHTML="<strong>Ação não é o mesmo que acontecimento.</strong> Cortar é uma ação. Revelar camadas é o acontecimento. Derramar é uma ação. Preencher e transbordar são o acontecimento. O produto chama atenção quando a ação produz uma recompensa visual clara."; f.append(note);
  const closing=h("section","closing"); closing.append(h("span","label","A pergunta de desenvolvimento")); const p=h("p"); p.innerHTML="Não perguntar apenas “como deixá-lo bonito?”. Perguntar: <strong>“O que podemos fazer acontecer com esse produto?”</strong>"; closing.append(p); f.append(closing);
  panel.replaceChildren(f);
}

function mediaFor(r) {
  if(r.video==="none") return null;
  const box=h("section","media"); const head=h("div","media-head"); head.append(h("span",null,"Vídeo de referência")); const link=h("a",null,"Abrir original ↗"); link.href=r.url; link.target="_blank"; link.rel="noopener noreferrer"; head.append(link); box.append(head);
  if(r.video==="youtube" || r.video==="short") { const wrap=h("div","video-wrap"+(r.video==="short"?" short":"")); const iframe=document.createElement("iframe"); iframe.src="https://www.youtube-nocookie.com/embed/"+r.videoId; iframe.title="Vídeo de referência: "+r.nome; iframe.loading="lazy"; iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"; iframe.allowFullscreen=true; wrap.append(iframe); box.append(wrap); }
  else if(r.video==="instagram") { const wrap=h("div","video-wrap short"); const iframe=document.createElement("iframe"); iframe.src="https://www.instagram.com/reel/"+r.videoId+"/embed/"; iframe.title="Vídeo de referência: "+r.nome; iframe.loading="lazy"; iframe.allowFullscreen=true; wrap.append(iframe); box.append(wrap); }
  else { const a=h("a","media-link"); a.href=r.url; a.target="_blank"; a.rel="noopener noreferrer"; a.append(h("span","play","▶")); const txt=h("span"); txt.append(h("strong",null,r.linkLabel)); txt.append(h("small",null,"Abre em uma nova aba")); a.append(txt); a.append(h("span",null,"Abrir ↗")); box.append(a); }
  return box;
}
function renderReferencias() {
  const r=REFS.find(x=>x.id===refAtual), layout=h("div","refs-layout"), nav=h("nav","ref-tabs"); nav.setAttribute("aria-label","Referências");
  REFS.forEach((x,i)=>{ const b=h("button","ref-tab"+(x.id===r.id?" on":"")); b.type="button"; b.append(h("span","n",String(i+1).padStart(2,"0"))); b.append(h("span",null,x.nome)); b.onclick=()=>{refAtual=x.id;history.replaceState(null,"","#referencias/"+refAtual);renderReferencias();window.scrollTo({top:0,behavior:"instant"});};nav.append(b); }); layout.append(nav);
  const content=h("article"); const hero=h("header","ref-hero"), title=h("div"); title.append(h("span","label","Referência "+String(REFS.indexOf(r)+1).padStart(2,"0")+" de "+REFS.length)); title.append(h("h2",null,r.nome)); title.append(h("p","source",r.fonte)); hero.append(title); const chips=h("div","chips"); r.mecanismos.forEach(m=>chips.append(h("span","mechanism",m))); hero.append(chips); content.append(hero); content.append(h("div","sequence",r.seq));
  const grid=h("div","ref-grid"); [["O que acontece",r.acontece],["Ação principal",r.acao],["Por que chama atenção?",r.atencao]].forEach(x=>{const b=h("section","ref-block");b.append(h("h3",null,x[0]));b.append(h("p",null,x[1]));grid.append(b);}); const principle=h("section","principle"); principle.append(h("h3",null,"Princípio para a Holy Cookie")); principle.append(h("p",null,r.principio)); grid.append(principle); content.append(grid); const media=mediaFor(r); if(media) content.append(media); layout.append(content); panel.replaceChildren(layout);
}

function renderBiblioteca() {
  const f=document.createDocumentFragment(); f.append(introBlock("Biblioteca de criação","Nove mecanismos para fazer alguma coisa acontecer.","Os mecanismos podem ser combinados. O objetivo não é copiar o prato de referência, mas transportar o princípio de atenção para um produto da Holy Cookie."));
  const lib=h("div","library"); MECANISMOS.forEach((m,i)=>{const c=h("article","mechanism-card");c.append(h("span","n",String(i+1).padStart(2,"0")));c.append(h("h3",null,m[0]));c.append(h("p",null,m[1]));lib.append(c);}); f.append(lib);
  const actionTitle=h("div","section-title"); actionTitle.style.marginTop="34px"; actionTitle.append(h("span","label","Biblioteca de ações")); actionTitle.append(h("h2",null,"O que podemos fazer com o produto?")); f.append(actionTitle); const actions=h("div","actions"); ACOES.forEach(a=>actions.append(h("span","action",a))); f.append(actions);
  const qs=h("div","questions"); [["01","Qual é a ação?","O que fazemos?"],["02","Qual é o acontecimento?","O que muda, aparece, cai, quebra, derrete, estica ou transborda?"],["03","Qual é a recompensa?","Por que alguém continuaria assistindo até o final?"]].forEach(q=>{const c=h("article","question");c.append(h("span",null,q[0]));c.append(h("h3",null,q[1]));c.append(h("p",null,q[2]));qs.append(c);}); f.append(qs);
  const closing=h("section","closing"); closing.append(h("span","label","Insight principal")); const p=h("p"); p.innerHTML="O produto performático não é apenas comida. <strong>Ele contém uma cena.</strong>"; closing.append(p); f.append(closing); panel.replaceChildren(f);
}
function redraw(){ document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.panel===painelAtual)); if(painelAtual==="conceito")renderConceito(); else if(painelAtual==="referencias")renderReferencias(); else renderBiblioteca(); }
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{painelAtual=b.dataset.panel;history.replaceState(null,"","#"+painelAtual+(painelAtual==="referencias"?"/"+refAtual:""));redraw();window.scrollTo({top:0,behavior:"instant"});});
window.addEventListener("hashchange",()=>{const [p,r]=location.hash.slice(1).split("/");if(["conceito","referencias","biblioteca"].includes(p))painelAtual=p;if(REFS.some(x=>x.id===r))refAtual=r;redraw();});
redraw();
</script>
</body>
</html>
